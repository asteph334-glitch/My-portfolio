<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anne-Marie Stephenson | Marketing strategist</title>
<meta name="description" content="Brand strategy joined to digital execution and measurable results, for membership, education and not-for-profit organisations.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 fill=%27%232E1519%27/%3E%3Ctext x=%2750%27 y=%2766%27 font-size=%2750%27 text-anchor=%27middle%27 fill=%27%23F1ECE6%27 font-family=%27Georgia,serif%27%3EAS%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#2E1519">
<meta property="og:title" content="Anne-Marie Stephenson | Marketing strategist">
<meta property="og:description" content="Brand strategy joined to digital execution and measurable results.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F1ECE6;--ink:#2E1519;--mut:#4A3329;--rule:#A89C92;--acc:#8A6A22;--accl:#B8923F;--band:#2E1519;--bandt:#F1ECE6;
--serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0d10;--ink:#F1ECE6;--mut:#CDBDAE;--rule:#6d5b52;--acc:#D1A752;--accl:#D1A752;--band:#2E1519;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b0d10;--ink:#F1ECE6;--mut:#CDBDAE;--rule:#6d5b52;--acc:#D1A752;--accl:#D1A752;--band:#2E1519;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.line{position:fixed;top:0;bottom:0;left:clamp(14px,4vw,56px);width:1px;background:var(--accl);transform-origin:top;animation:draw 1.8s cubic-bezier(.2,.7,.2,1) both;z-index:1;pointer-events:none}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.line{animation:none}html{scroll-behavior:auto}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem clamp(28px,8vw,120px) 1rem clamp(36px,9vw,128px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.brand{font:500 1.25rem var(--serif);text-decoration:none;letter-spacing:-.01em}
nav{display:flex;gap:1.4rem;flex-wrap:wrap;font-size:.95rem}
nav a{text-decoration:none;color:var(--mut)}nav a:hover,nav a[aria-current]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accl);text-underline-offset:6px}
main{position:relative;z-index:2}
.wrap{padding:0 clamp(28px,8vw,120px) 0 clamp(36px,9vw,128px);max-width:1240px}
section{padding:clamp(3.5rem,9vw,7rem) 0}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;line-height:1.05;margin:0}
h1{font-size:clamp(2.5rem,7.4vw,5.8rem)}h2{font-size:clamp(1.9rem,4.4vw,3.2rem);margin-bottom:1.2rem}h3{font-size:1.5rem;line-height:1.2}
p{max-width:62ch;margin:.8rem 0}.lead{font-size:1.25rem;color:var(--mut);max-width:48ch}
.hero{position:relative;min-height:84vh;display:flex;align-items:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-10% -10% -10% 30%;background:radial-gradient(ellipse 18% 14% at 30% 25%,color-mix(in srgb,var(--rule) 40%,transparent),transparent 70%),radial-gradient(ellipse 12% 20% at 62% 40%,color-mix(in srgb,var(--rule) 34%,transparent),transparent 70%),radial-gradient(ellipse 22% 12% at 48% 72%,color-mix(in srgb,var(--rule) 30%,transparent),transparent 70%),radial-gradient(ellipse 10% 10% at 80% 18%,color-mix(in srgb,var(--rule) 38%,transparent),transparent 70%);filter:blur(14px);z-index:-1}
.btn{display:inline-block;margin-top:1.6rem;padding:.9rem 1.6rem;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;border-radius:2px}
.btn:hover{background:var(--acc);color:#fff}
.ph{color:var(--mut);border-bottom:1px dashed var(--accl);font-style:normal}
.sub{color:var(--mut);font-size:.95rem}
.rule{border:0;border-top:1px solid var(--rule);margin:0}
/* system */
.tabs{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.4rem 0}
.tabs button{font:inherit;padding:.55rem 1rem;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sys{display:grid;grid-template-columns:1fr;gap:0;margin-top:1rem}
.node{display:grid;grid-template-columns:1.4rem 1fr;gap:1rem;padding:.7rem 0;opacity:.35;transition:opacity .4s}
.node.on{opacity:1}.node i{width:11px;height:11px;border-radius:50%;border:1px solid var(--rule);margin-top:.5rem;background:var(--bg)}
.node.on i{background:var(--accl);border-color:var(--accl)}
.node b{font-weight:600}
.out{margin-top:1rem;padding:1.2rem 1.4rem;border:1px dashed var(--accl)}
/* work */
.case{display:grid;grid-template-columns:1fr;gap:.4rem;padding:2rem 0;border-top:1px solid var(--rule);text-decoration:none}
.case:hover h3{text-decoration:underline;text-decoration-color:var(--accl);text-underline-offset:8px}
@media(min-width:800px){.case{grid-template-columns:14rem 1fr 12rem;gap:2rem;align-items:baseline}}
/* band */
.band{background:var(--band);color:var(--bandt);position:relative;z-index:2}
.band .sub,.band .ph{color:#CDBDAE}.band h2{color:var(--bandt)}
.themes{display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:2rem}
blockquote{margin:0;padding-left:1rem;border-left:1px solid var(--accl);font:400 1.25rem/1.4 var(--serif)}
.caps{columns:2 16rem;gap:3rem;margin:1.5rem 0 0;padding:0;list-style:none}
.caps li{break-inside:avoid;padding:.9rem 0;border-top:1px solid var(--rule)}.caps b{display:block;font-weight:600}
/* case page */
.stage{display:grid;grid-template-columns:1fr;gap:.3rem 2rem;padding:2rem 0;border-top:1px solid var(--rule)}
@media(min-width:800px){.stage{grid-template-columns:11rem 1fr}}
.stage h3{font-size:1.3rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}.chips span{border:1px solid var(--rule);padding:.25rem .75rem;border-radius:99px;font-size:.9rem}
.tl{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:1rem 0;font-size:.8rem}
.tl div{height:1.6rem;background:color-mix(in srgb,var(--rule) 35%,transparent)}
.tl .l{background:none;height:auto;grid-column:span 12;color:var(--mut);margin-top:.5rem}
/* evidence */
.kpis{display:grid;gap:1px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));background:var(--rule);border:1px solid var(--rule)}
.kpi{background:var(--bg);padding:1.4rem}.kpi .n{font:400 2.4rem var(--serif);font-variant-numeric:tabular-nums;color:var(--mut)}
.chart{margin:2rem 0;border:1px dashed var(--accl);padding:1.2rem}
.chart svg{width:100%;height:auto;display:block}
.tag{display:inline-block;font-size:.85rem;color:var(--mut);margin-bottom:.6rem}
footer{padding:3rem 0 4rem;position:relative;z-index:2}
</style>
</head>
<body>
<div class="line" aria-hidden="true"></div>
<header>
  <a class="brand" href="#home">Anne-Marie Stephenson</a>
  <nav aria-label="Main"><a href="#home">Home</a><a href="#work">Work</a><a href="#evidence">Evidence</a><a href="#about">About</a></nav>
</header>
<main id="app"></main>
<footer><div class="wrap sub">© Anne-Marie Stephenson. Marketing strategist. <a href="#about">Get in touch</a></div></footer>

<script>
/* ===== EDIT YOUR CONTENT HERE =====
   Anything in [square brackets] is a placeholder. Replace it with your real evidence.
   Nothing on this site is a real result until you replace it. */
const SITE = {
  email: "[your email address]",
  linkedin: "[your LinkedIn URL]",
  about: ["[Two or three sentences in your own voice: who you are, how you work, what you believe about marketing.]",
          "[One sentence on the kind of organisation you do your best work for.]"]
};
const CHANNELS = ["Brand strategy","SEO","PPC","Meta and social","Email and CRM","Events and partnerships","Analytics and reporting"];
const CASES = [
  {id:"membership", org:"Membership organisation", title:"[Case study title: e.g. a renewal or recruitment campaign]",
   insight:"[What did you learn about members or prospects that shaped the plan? Cite your research source.]",
   idea:"[The single brand idea the campaign was built around, in one line.]",
   on:[0,1,2,3,4,6], result:"[Your measured outcome, with the metric, the period and the baseline]"},
  {id:"education", org:"Education", title:"[Case study title: e.g. a student or course recruitment campaign]",
   insight:"[The audience insight that changed your approach.]",
   idea:"[The brand idea that tied the channels together.]",
   on:[0,1,2,3,5,6], result:"[Your measured outcome, with the metric, the period and the baseline]"},
  {id:"charity", org:"Not-for-profit", title:"[Case study title: e.g. a fundraising or awareness campaign]",
   insight:"[The supporter or beneficiary insight behind the work.]",
   idea:"[The brand idea that carried the campaign.]",
   on:[0,1,3,4,5,6], result:"[Your measured outcome, with the metric, the period and the baseline]"}
];
const CAPS = [
 ["Brand marketing and strategy","Positioning, proposition and identity that every channel can act on."],
 ["SEO and organic growth","Search visibility built to last beyond any one campaign."],
 ["PPC and Google Ads","Paid search structured around the outcome, not the click."],
 ["Meta advertising and social","Audience-led paid and organic social."],
 ["Digital marketing strategy","One plan that joins brand intent to channel delivery."],
 ["Integrated campaigns","Campaigns planned as a system, with one idea running through them."],
 ["Analytics and reporting","Dashboards that show leaders what changed and why."]
];
const THEMES = [
 ["[Theme from your research]","“[A real quote from a member, student or supporter, with permission]”"],
 ["[Second theme]","“[Another real quote, or a survey finding with the sample size]”"],
 ["[Third theme]","“[A real quote or a finding that changed a decision]”"]
];
/* ===== END CONTENT ===== */

const $ = s => document.querySelector(s), app = $("#app");
const ph = t => `<span class="ph">${t}</span>`;
let sel = 0;

function system(){
  const c = CASES[sel];
  return `<div class="tabs" role="group" aria-label="Choose a campaign">${CASES.map((x,i)=>`<button aria-pressed="${i===sel}" data-i="${i}">${x.org}</button>`).join("")}</div>
  <div class="sys" aria-live="polite">
   <div class="node on"><i></i><div><b>Brand idea</b><br>${ph(c.idea)}</div></div>
   ${CHANNELS.map((n,i)=>`<div class="node ${c.on.includes(i)?"on":""}"><i></i><div><b>${n}</b>${c.on.includes(i)?"":" <span class='sub'>(not used here)</span>"}</div></div>`).join("")}
   <div class="out"><b>Result</b><br>${ph(c.result)}</div>
  </div>
  <p class="sub">Channel selection shown is a sample structure. Set the real channels for each campaign in the data at the top of the file.</p>`;
}

function home(){
  app.innerHTML = `
  <section class="hero"><div class="wrap">
    <h1>Brand is the plan.<br>Digital is how it’s delivered.<br>Results are how we know.</h1>
    <p class="lead">Anne-Marie Stephenson is a marketing strategist for membership, education and not-for-profit organisations.</p>
    <a class="btn" href="#about">Start a conversation</a>
  </div></section>
  <hr class="rule">
  <section><div class="wrap">
    <h2>One idea, running through every channel</h2>
    <p>Most marketing fails where brand and performance are planned separately. Choose a campaign to see how the idea travels from strategy to result.</p>
    <div id="sys">${system()}</div>
  </div></section>
  <hr class="rule">
  <section><div class="wrap">
    <h2>Selected work</h2>
    ${CASES.map(c=>`<a class="case" href="#${c.id}"><span class="sub">${c.org}</span><h3>${c.title}</h3><span class="sub">Read the case study</span></a>`).join("")}
  </div></section>
  <div class="band"><section><div class="wrap">
    <h2>What the numbers can’t tell you</h2>
    <p class="sub">Audience and member insight that shaped decisions. Replace with your real research.</p>
    <div class="themes">${THEMES.map(t=>`<div><h3>${t[0]}</h3><p><blockquote>${t[1]}</blockquote></p></div>`).join("")}</div>
  </div></section></div>
  <section><div class="wrap">
    <h2>Capabilities</h2>
    <ul class="caps">${CAPS.map(c=>`<li><b>${c[0]}</b>${c[1]}</li>`).join("")}</ul>
    <p style="margin-top:2.5rem"><a class="btn" href="#evidence">See the evidence</a></p>
  </div></section>`;
}

function caseStudy(c){
  app.innerHTML = `<section><div class="wrap">
   <a class="sub" href="#work">Back to work</a>
   <p class="sub" style="margin-top:2rem">${c.org}</p>
   <h1 style="font-size:clamp(2.2rem,5.6vw,4.4rem)">${c.title}</h1>
   <div class="stage"><h3>Insight</h3><div><p>${ph(c.insight)}</p></div></div>
   <div class="stage"><h3>Brand idea</h3><div><p>${ph(c.idea)}</p></div></div>
   <div class="stage"><h3>Channels</h3><div><div class="chips">${c.on.map(i=>`<span>${CHANNELS[i]}</span>`).join("")}</div>
     <div class="tl" aria-label="Sample campaign timeline">${"<div></div>".repeat(12)}<div class="l">Timeline placeholder: add the real start, launch and review dates.</div></div>
     <p>${ph("[What you did in each channel, and why you sequenced it this way]")}</p></div></div>
   <div class="stage"><h3>Result</h3><div><p>${ph(c.result)}</p><p>${ph("[Your role, the team, and what you would do differently]")}</p></div></div>
  </div></section>`;
}

function evidence(){
  const bars = [40,52,47,63,58,74,70,86,80,92,88,100];
  app.innerHTML = `<section><div class="wrap">
   <h1 style="font-size:clamp(2.2rem,5.6vw,4.4rem)">Evidence</h1>
   <p class="lead">Quantitative performance and qualitative insight, side by side.</p>
   <p class="sub"><b>Sample structure, not real data.</b> Every figure below is a placeholder until you add your own.</p>
   <div class="kpis" style="margin-top:2rem">${["Organic sessions","Paid return on spend","Conversion rate","Cost per acquisition"].map(k=>`<div class="kpi"><span class="sub">${k}</span><div class="n">[ — ]</div><span class="sub">[period, baseline]</span></div>`).join("")}</div>
   <div class="chart"><span class="tag">Sample layout: organic growth over 12 months</span>
    <svg viewBox="0 0 600 180" role="img" aria-label="Placeholder bar chart, not real data">${bars.map((b,i)=>`<rect x="${i*50+8}" y="${170-b*1.6}" width="34" height="${b*1.6}" fill="none" stroke="var(--rule)" stroke-dasharray="4 3"/>`).join("")}<line x1="0" y1="170" x2="600" y2="170" stroke="var(--rule)"/></svg></div>
   <div class="chart"><span class="tag">Sample layout: spend against return by channel</span>
    <svg viewBox="0 0 600 120" role="img" aria-label="Placeholder channel chart, not real data">${["SEO","PPC","Meta","Email"].map((n,i)=>`<text x="0" y="${i*30+20}" fill="var(--mut)" font-size="13">${n}</text><rect x="90" y="${i*30+6}" width="${[380,300,220,150][i]}" height="18" fill="none" stroke="var(--rule)" stroke-dasharray="4 3"/>`).join("")}</svg></div>
   <h2 style="margin-top:3rem">Audience and member insight</h2>
   <div class="themes">${THEMES.map(t=>`<div><h3>${t[0]}</h3><blockquote>${t[1]}</blockquote></div>`).join("")}</div>
  </div></section>`;
}

function about(){
  app.innerHTML = `<section><div class="wrap">
   <h1 style="font-size:clamp(2.2rem,5.6vw,4.4rem)">About</h1>
   ${SITE.about.map(t=>`<p class="lead">${ph(t)}</p>`).join("")}
   <p class="sub">[Portrait photo to be added]</p>
   <h2 style="margin-top:3rem">Let’s talk</h2>
   <p>If you are planning brand, search, paid or social work and want it to join up, get in touch.</p>
   <p>Email: ${ph(SITE.email)}<br>LinkedIn: ${ph(SITE.linkedin)}</p>
  </div></section>`;
}

function work(){
  app.innerHTML = `<section><div class="wrap"><h1 style="font-size:clamp(2.2rem,5.6vw,4.4rem)">Work</h1>
   <p class="lead">Case studies across membership, education and not-for-profit.</p>
   ${CASES.map(c=>`<a class="case" href="#${c.id}"><span class="sub">${c.org}</span><h3>${c.title}</h3><span class="sub">Read the case study</span></a>`).join("")}
  </div></section>`;
}

function route(){
  const h = (location.hash||"#home").slice(1), c = CASES.find(x=>x.id===h);
  if(c) caseStudy(c); else if(h==="evidence") evidence(); else if(h==="about") about(); else if(h==="work") work(); else home();
  document.querySelectorAll("nav a").forEach(a=>{ if(a.getAttribute("href")==="#"+(c?"work":h)) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}
app.addEventListener("click",e=>{ const b=e.target.closest("#sys button"); if(b){ sel=+b.dataset.i; $("#sys").innerHTML=system(); } });
addEventListener("hashchange",route); route();
</script>
</body>
</html>
